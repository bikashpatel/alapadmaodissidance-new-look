services:
  web:
    build: .
    image: alapadma-odissi-dance:latest
    container_name: alapadma-web
    ports:
      # Published on localhost only: put Cloudflare Tunnel (cloudflared) or a reverse proxy in front.
      # To expose the port directly instead, set HOST_BIND=0.0.0.0 AND TRUST_PROXY=0.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      # Secret admin URL. Change it (e.g. /studio-desk-7381) so the panel is not at a guessable address.
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
      # First-time admin password (only used until a password is saved; change it later in Admin → Account).
      # If empty, a random password is generated and printed once in the logs: docker compose logs web
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # "1" = trust Cloudflare's CF-Connecting-IP / X-Forwarded-Proto headers. Only safe when the
      # container is reachable solely through Cloudflare (see ports above). Use "0" otherwise.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - alapadma-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  alapadma-data:
